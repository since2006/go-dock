name: release

# Push a tag like v0.2.0 to publish a release. go-dock's online update
# downloads the assets built here: one raw binary per platform named
# go-dock_<os>_<arch>[.exe], plus SHA256SUMS. The screen firmware is
# attached as go-dock-firmware-v2.bin.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
          - { runner: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0" }
          # macOS builds natively with cgo so the screen is found by USB VID/PID.
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: "1" }
          - { runner: macos-latest, goos: darwin, goarch: amd64, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/go-dock_${GOOS}_${GOARCH}${ext}" ./cmd/go-dock
      - uses: actions/upload-artifact@v7
        with:
          name: go-dock_${{ matrix.goos }}_${{ matrix.goarch }}
          path: host/dist/*

  firmware:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The firmware reports the release's version; go-dock offers it the
      # firmware of its own version.
      - name: version
        run: echo "${GITHUB_REF_NAME#v}" > firmware/version.txt
      - uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          # go-dock-firmware-v2.bin: one image from address 0x0 (bootloader,
          # partition table, app) for flashing over USB by hand.
          # go-dock-firmware-v2-app.bin: the app alone, which go-dock sends
          # to the device to update it.
          command: >-
            idf.py build && idf.py merge-bin -o go-dock-firmware-v2.bin &&
            cp build/go-dock-firmware.bin build/go-dock-firmware-v2-app.bin
      - uses: actions/upload-artifact@v7
        with:
          name: go-dock-firmware-v2
          path: |
            firmware/build/go-dock-firmware-v2.bin
            firmware/build/go-dock-firmware-v2-app.bin

  release:
    needs: [build, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum go-dock_* go-dock-firmware-* > SHA256SUMS && cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags like v0.2.0-beta.1 become pre-releases. GitHub's "latest
        # release", which online update follows, never points at one.
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $flags \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
