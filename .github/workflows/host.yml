name: host

on:
  push:
    branches: [main]
    paths: ["host/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/host.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: host

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "dist/go-dock-${GOOS}-${GOARCH}${ext}" ./cmd/go-dock
      - uses: actions/upload-artifact@v7
        with:
          name: go-dock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: host/dist/*
